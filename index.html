<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#240e0e">
    <meta name="description" content="Mahad Aslam and Sidra Arif's wedding invitation.">
    <title>Mahad &amp; Sidra — Wedding Invitation</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="invitation" aria-label="Mahad Aslam and Sidra Arif wedding invitation">
      <!-- The approved final JPEGs are the visual source of truth. -->
      <section id="opening" class="invitation-page" aria-label="Invitation opening">
        <img src="01-entry.jpeg" width="860" height="1720" alt="Wedding invitation opening for Mahad Aslam and Sidra Arif.">
        <a class="hotspot hotspot--enter" href="#couple" aria-label="Enter invitation"></a>
      </section>

      <section id="couple" class="invitation-page" aria-label="Couple and celebration countdown">
        <img src="02-hero-countdown.jpeg" width="860" height="1720" alt="Mahad Aslam and Sidra Arif with celebration countdown.">
      </section>

      <section id="journey" class="invitation-page" aria-label="Wedding journey">
        <img src="03-wedding-journey.jpeg" width="860" height="1720" alt="Wedding journey with Mehndi, Barat, and Walima.">
      </section>

      <section id="mehndi" class="invitation-page" aria-label="Mehndi details">
        <img src="04-mehndi.jpeg" width="860" height="1720" alt="Mehndi event details.">
        <a class="hotspot hotspot--mehndi-map" href="https://maps.app.goo.gl/Kn7wLwVVS8rxh9KG6" target="_blank" rel="noopener" aria-label="Open Mehndi venue in Google Maps"></a>
      </section>

      <section id="female-mehndi-hosts" class="invitation-page" aria-label="Ladies of the Mehndi">
        <img src="05-female-mehndi-hosts.jpeg" width="860" height="1720" alt="Ladies of the Mehndi hosts.">
      </section>

      <section id="male-mehndi-hosts" class="invitation-page" aria-label="Gentlemen of the Mehndi">
        <img src="06-male-mehndi-hosts.jpeg" width="860" height="1720" alt="Gentlemen of the Mehndi hosts.">
      </section>

      <section id="barat" class="invitation-page" aria-label="Barat details">
        <img src="07-barat.jpeg" width="860" height="1720" alt="Barat event details.">
        <a class="hotspot hotspot--barat-map" href="https://maps.app.goo.gl/2ndoWRFfk1gkv2Rq8" target="_blank" rel="noopener" aria-label="Open Barat venue in Google Maps"></a>
      </section>

      <section id="walima" class="invitation-page" aria-label="Walima details">
        <img src="08-walima.jpeg" width="860" height="1720" alt="Walima event details.">
        <a class="hotspot hotspot--walima-map" href="https://maps.app.goo.gl/2ndoWRFfk1gkv2Rq8" target="_blank" rel="noopener" aria-label="Open Walima venue in Google Maps"></a>
      </section>

      <section id="rsvp" class="invitation-page" aria-label="RSVP hosts">
        <img src="09-rsvp.jpeg" width="860" height="1720" alt="RSVP hosts.">
      </section>

      <section id="looking-forward" class="invitation-page" aria-label="Looking forward contact details">
        <img src="10-looking-forward.jpeg" width="860" height="1720" alt="Looking forward contact details.">
        <div class="share-button-removal" aria-hidden="true">
          <img src="10-looking-forward-share-removed-repair.png" width="887" height="1774" alt="">
        </div>
        <a class="hotspot hotspot--contact-one" href="tel:+923206511552" aria-label="Call Mian Zahid at 0320 6511552"></a>
        <a class="hotspot hotspot--contact-two" href="tel:+923144510014" aria-label="Call Abdullah Aslam at 0314 4510014"></a>
      </section>

      <section id="closing" class="invitation-page" aria-label="Invitation closing">
        <img src="11-closing.jpeg" width="860" height="1720" alt="Wedding invitation closing.">
      </section>
    </main>
  </body>
</html>
